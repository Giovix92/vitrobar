<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vitrobar</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1f3c"/>
      <stop offset="0.45" stop-color="#244878"/>
      <stop offset="0.78" stop-color="#9a6f88"/>
      <stop offset="1" stop-color="#f6a35a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="700" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a5d86"/>
      <stop offset="0.25" stop-color="#1b3657"/>
      <stop offset="1" stop-color="#08121f"/>
    </linearGradient>
    <radialGradient id="glow" cx="636" cy="590" r="410.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#f4884e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4884e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.4" stop-color="#ffd27f"/>
      <stop offset="1" stop-color="#f08f45"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27f"/><stop offset="1" stop-color="#f0a04b"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce8f4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glassfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="glassrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
    <clipPath id="pill"><rect x="168" y="600" width="688" height="180" rx="90.0"/></clipPath>
    <filter id="frost" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
      <feColorMatrix type="saturate" values="1.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="sunglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="ripple" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#08121f" flood-opacity="0.35"/>
    </filter>
    <g id="scene">
      <rect width="1024" height="700" fill="url(#sky)"/>
      <rect y="700" width="1024" height="324" fill="url(#lake)"/>
      <rect width="1024" height="1024" fill="url(#glow)"/>
      <circle cx="636" cy="590" r="173.8" fill="#ffb457" opacity="0.6" filter="url(#sunglow)"/>
      <circle cx="636" cy="590" r="158" fill="url(#sun)"/>
      <!-- the lake hides the sun's lower half -->
      <rect y="700" width="1024" height="324" fill="url(#lake)" opacity="0.92"/>
      <rect x="0" y="698" width="1024" height="4" fill="#ffd9a0" opacity="0.5"/>
      
      <!-- far shore -->
      <path d="M0 700 C 140 654, 260 642, 400 682 L 430 700 Z" fill="#132a47"/>
      <path d="M760 700 C 840 670, 940 664, 1024 686 L 1024 700 Z" fill="#17304f"/>
      <!-- the sun on the water -->
      <g fill="#ffcf7a" filter="url(#ripple)">
        <rect x="506" y="816" width="260" height="10" rx="5" opacity="0.55"/>
        <rect x="546" y="846" width="180" height="9" rx="4.5" opacity="0.4"/>
        <rect x="580" y="874" width="112" height="8" rx="4" opacity="0.28"/>
        <rect x="606" y="899" width="60" height="7" rx="3.5" opacity="0.18"/>
      </g>
      <!-- stars -->
      <g fill="#ffffff">
        <circle cx="210" cy="210" r="5" opacity="0.8"/>
        <circle cx="330" cy="150" r="3.5" opacity="0.55"/>
        <circle cx="160" cy="360" r="3" opacity="0.45"/>
        <circle cx="420" cy="260" r="2.5" opacity="0.4"/>
        <circle cx="820" cy="190" r="3" opacity="0.4"/>
      </g>
    </g>
  </defs>

  <rect x="64" y="88" width="896" height="896" rx="216"
        fill="#040b16" opacity="0.5" filter="url(#soft)"/>
  <g clip-path="url(#tile)">
    <use href="#scene"/>
    <!-- the glass bar: what is behind it, frosted -->
    <rect x="178" y="630" width="668" height="180" rx="90.0"
          fill="#030a14" opacity="0.5" filter="url(#soft)"/>
    <g clip-path="url(#pill)">
      <use href="#scene" filter="url(#frost)"/>
      <rect x="168" y="600" width="688" height="180" fill="url(#glassfill)"/>
    </g>
    <rect x="170.5" y="602.5" width="683" height="175" rx="87.5"
          fill="none" stroke="url(#glassrim)" stroke-width="5"/>
    <rect x="324.0" y="632.0" width="96" height="96" rx="25.9" fill="url(#app)" filter="url(#lift)"/><rect x="464.0" y="632.0" width="96" height="96" rx="25.9" fill="url(#app)" filter="url(#lift)"/><rect x="604.0" y="632.0" width="96" height="96" rx="25.9" fill="url(#app)" filter="url(#lift)"/>
    <rect x="482.0" y="744.0" width="60" height="13" rx="6.5" fill="url(#amber)"/>
    <rect x="67" y="67" width="890" height="890" rx="213"
          fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
</svg>
