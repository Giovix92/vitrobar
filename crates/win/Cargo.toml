[package]
name = "vitro-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vitro-core = { path = "../core" }
# The `#[interface]` / `#[implement]` macros expand to `windows_core::` paths.
windows-core = "0.62.2"
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "UI",
    "UI_ViewManagement",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_RemoteDesktop",
    "Win32_System_Search",
    "Win32_System_Search_Common",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
# Tests only: an isolated window station gives the clipboard test its own clipboard.
windows = { version = "0.62.2", features = ["Win32_System_StationsAndDesktops"] }
