name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - run: cargo build --release --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: vitrobar-x64
          path: target/x86_64-pc-windows-msvc/release/vitrobar.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vitrobar-arm64
          path: target/aarch64-pc-windows-msvc/release/vitrobar.exe

  perf:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrobar-x64
          path: bin
      # Enforces the exe-size and idle-CPU budgets. Memory is reported, not enforced: the
      # runner's desktop is not the controlled one the memory gate needs (possibly no
      # Explorer shell, so no stock taskbar, tray icons or File Explorer windows; other
      # Windows components loaded), so its figure is not comparable. The 40 MB budget is
      # enforced by local runs of the same script (docs/release-checklist.md,
      # "Performance"). GPU use is checked by hand.
      - name: Performance budget check
        shell: pwsh
        run: ./scripts/perf-check.ps1 -Exe bin/vitrobar.exe -MemoryReportOnly
